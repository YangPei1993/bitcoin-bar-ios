name: BitcoinBarIOS
options:
  bundleIdPrefix: com.paul
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  BitcoinBarIOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: bitcoin-bar
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen:
          UIColorName: AccentColor
        BGTaskSchedulerPermittedIdentifiers:
          - com.paul.bitcoin-bar-ios.refresh
        UIBackgroundModes:
          - fetch
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paul.bitcoin-bar-ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: BitcoinBarLiveActivity
        embed: true

  BitcoinBarLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivityExtension
      - path: Shared
    info:
      path: LiveActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: bitcoin-bar 灵动岛
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paul.bitcoin-bar-ios.live-activity
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

schemes:
  BitcoinBarIOS:
    build:
      targets:
        BitcoinBarIOS: all
        BitcoinBarLiveActivity: all
    run:
      config: Debug
    archive:
      config: Release
